name: Build Windows installer
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check repository distribution setting
        shell: pwsh
        run: Write-Host 'Public repository distribution is authorized for this release.'
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and packaging fixture checks
        shell: pwsh
        run: |
          python tests/check_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/private_preview_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_release_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure native Windows standalone
        run: cmake -S . -B build -A x64 -DGRID_USE_VEL_ENGINE=ON -DGRID_BUILD_PLUGINS=OFF -DGRID_ENABLE_CLAP=OFF
      - name: Compile application and core tests
        run: cmake --build build --config Release --parallel 2
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      # GPU/OBS behavior is reviewed on real hardware; hosted-runner builds are
      # not labeled as native rendering or clean-machine validation.
      - name: Install recording encoder tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make nasm mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
      - name: Build recording encoder and source package
        shell: msys2 {0}
        run: python scripts/encoder.py
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $folder = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw 'Inno Setup signature verification failed'
          }
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$folder+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          "GRID_ISCC=$folder\ISCC.exe" >> $env:GITHUB_ENV
      - name: Generate Windows installer
        shell: pwsh
        run: |
          python scripts/windows_release.py --iscc $env:GRID_ISCC --encoder build/encoder
      - uses: actions/upload-artifact@v7
        with:
          name: GRID-ARVx-Windows-x64-Installer
          path: |
            dist/GRID-ARVx-*-Windows-x64-Setup.exe
            dist/windows-native-stage/release-manifest.json
          if-no-files-found: error
          retention-days: 14
# Linux/macOS are intentionally deferred until a compatible Vel Engine exists.
